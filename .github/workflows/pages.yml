name: Publish Icon Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static catalog from manifest
        run: python3 tools/build_site.py
      - name: Install image validation dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Install image validation dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Validate catalog and sprite geometry
        run: python3 -m unittest discover -s tests -p 'test_site.py' -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
