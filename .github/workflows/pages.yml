name: Publish Visual Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static catalog from manifest
        run: python3 tools/build_site.py
      - name: Install image validation dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Validate catalog and sprite geometry
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate browser search and dynamic filters
        run: node --check web/app.js && node tests/browser-search.cjs
      - name: Validate local-first builder, ZIP import/export primitives and packaged demo
        run: node --check web/builder.js && node --check web/timeline-core.js && node tests/builder-contract.cjs && node tests/timeline-core.cjs && python3 tools/validate_visual_pack.py web/demo/starter-pack.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
